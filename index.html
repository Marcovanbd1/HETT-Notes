<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HETT panel cards</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--soft:#6b6862;--line:#e3e0d8;--accent:#2f4d3a;--accent-soft:#e7ede8;--close:#f3ede1;--close-ink:#5a4520;}
@media (prefers-color-scheme: dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#f1efe9;--soft:#a39f96;--line:#33322e;--accent:#9cc3a8;--accent-soft:#223028;--close:#2b2518;--close-ink:#e6cf9c;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer}
.nav button b{display:block;font-size:15px;color:var(--accent)}
.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav button.on b{color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.on{display:block}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.head .n{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.head .t{font-size:20px;font-weight:650}
.q{font-size:13.5px;line-height:1.5;color:var(--soft);margin:0 0 16px;border-left:2px solid var(--line);padding-left:10px}
.q strong{color:var(--ink);font-weight:600}
.lab{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:5px}
.open{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;font-weight:600;margin-bottom:16px}
ul{list-style:none;margin:0 0 16px;padding:0}
li{position:relative;padding:10px 0 10px 22px;font-size:19px;line-height:1.35;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li::before{content:"";position:absolute;left:4px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
li strong{font-weight:700}
.close{background:var(--close);color:var(--close-ink);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;font-weight:600}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap" id="wrap"></div>
<script>
const data = [
 {
  "q": 1,
  "tag": "Foundations",
  "question": "The Neighbourhood Health Framework sets a clear ambition, but what **practical foundations** in **data, infrastructure, workforce, and system capability** are needed to deliver it **at scale**?",
  "open": "Voice holds great potential for healthcare. Over time, AVT will sink into the system and become the way we do things.",
  "bullets": [
   "AVT becomes **infrastructure**: who owns it?",
   "UK company, UK servers, **how funded?**",
   "Across the **neighbourhood**, not just the consulting room",
   "18 months, **Lexacom**, founder came himself"
  ],
  "close": "We haven't rolled AVT out yet, deliberately. We'll make sure we get the practical foundations right. They come before the technology itself."
 },
 {
  "q": 2,
  "tag": "Interoperability",
  "question": "How do we move from **fragmented systems** to **true interoperability** that enables **real-time collaboration** across **multidisciplinary neighbourhood teams**, and what **building blocks** must be in place **first**?",
  "open": "Health, social care and the voluntary sector don't share a record. Before I joined the NHS, I assumed they already did. And the systems won't join up any time soon.",
  "bullets": [
   "Start from **the person**, not the systems",
   "Three routes in: **reception, QR codes, PCN website**",
   "Built through an **INT lens**: one team around the person",
   "Two or three taps: **one front door**"
  ],
  "close": "The patient shouldn't have to do the legwork of joining up those services."
 },
 {
  "q": 3,
  "tag": "Transformation",
  "question": "What needs to change in how neighbourhood teams are **designed, supported, and connected** to ensure **genuine transformation** rather than simply **repackaging existing services**?",
  "open": "You said “repackaging,” and that's what happens when we design teams with the same people, the same training and the same thinking.",
  "bullets": [
   "Design teams with **different backgrounds**",
   "AI: **ethics, fairness, what we owe the person**",
   "Applied philosophy: **never needed mine more**"
  ],
  "close": "Transformation doesn't come from new structures. It comes from new thinking inside them. I'm still waiting for Google or Apple to make me their Applied Philosopher in Residence. They haven't called yet."
 },
 {
  "q": 4,
  "tag": "GP data",
  "question": "How can **general practice data** be better leveraged to support **prevention, early intervention, and population health management**, and are **current EPRs equipped** to support this level of integration and complexity?",
  "open": "General practice data is incredibly rich. Decades of it, for almost everyone in the neighbourhood. But it was built for the appointment, not the population.",
  "bullets": [
   "Records what was treated, **not what's going on**",
   "EPRs: one consultation at a time, **can't see it coming**",
   "**Neighbourhood Signals**: anonymous taps, no personal data",
   "Alongside the GP record: **the whole picture**"
  ],
  "close": "EPRs tell us what people come in with. Neighbourhood signals tell us what they're living with."
 },
 {
  "q": 5,
  "tag": "Barriers",
  "question": "What are the key **operational barriers** to making neighbourhood health a reality, particularly around **trust, shared access, communication, governance, and role clarity**?",
  "open": "The biggest trust barrier I see is this. What I'm seeing on the ground, and hearing from clinicians and patients, is that people are recording their appointments.",
  "bullets": [
   "ChatGPT, smart glasses, phones: **no thought for the recording**",
   "Clinicians get scribes: **patients should too**",
   "**The voice recorder the NHS can trust**",
   "Clinicians: ever been recorded? Everyone: **ever recorded?**"
  ],
  "close": "Find me afterwards and ask me about MyScribe."
 },
 {
  "q": 6,
  "tag": "Co-production",
  "question": "How can **co-production** between **solution providers and neighbourhood teams** drive more **meaningful adoption** of digital tools, and what **examples** demonstrate this **working successfully in practice**?",
  "open": "I see co-production a bit differently. Usually, a supplier builds a product, then looks for an NHS site to try it on. I start with a problem in my neighbourhood, and then go looking for the companies to help me solve it.",
  "bullets": [
   "**MyScribe**: Deepgram (voice), Accuro (NHS reach), PKB (patient-held records)",
   "**Shuru Tech**: build started yesterday",
   "Brought together around **my neighbours' problem**"
  ],
  "close": "That's real co-production. It starts with the neighbourhood's problem, not the supplier's product."
 },
 {
  "q": 7,
  "tag": "Partnerships",
  "question": "Given that many **determinants of health sit outside healthcare**, how can we **strengthen partnerships with local authorities and VCSE organisations** to deliver preventative support, improve outcomes, and reduce future demand on services?",
  "open": "I've talked a lot about neighbourhood team working already.",
  "bullets": [
   "VCS: **equal partner**. Local authorities: others know better",
   "**Framework**: policy, surveys, patient voice. **Function**: build",
   "Tired, stressed, overwhelmed: **things look different**",
   "**Afternote**: private GPs have it, **NHS should too**"
  ],
  "close": "In Weymouth and on Portland, that's what we're doing. We're building the gold standard in neighbourhood health. Come and find me."
 }
];
function md(t){const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
const nav=document.getElementById('nav'),wrap=document.getElementById('wrap');
data.forEach((d,i)=>{
  const bt=document.createElement('button');bt.innerHTML='<b>Q'+d.q+'</b>'+d.tag;bt.onclick=()=>show(i);nav.appendChild(bt);
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="head"><span class="n">Q'+d.q+'</span><span class="t">'+d.tag+'</span></div>'+
    '<p class="q">'+md(d.question)+'</p>'+
    '<div class="open"><span class="lab">Open</span>'+md(d.open)+'</div>'+
    '<ul>'+d.bullets.map(b=>'<li>'+md(b)+'</li>').join('')+'</ul>'+
    '<div class="close"><span class="lab">Close</span>'+md(d.close)+'</div>';
  wrap.appendChild(c);
});
const home=document.createElement('button');home.innerHTML='<b>All</b>list';nav.appendChild(home);
home.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.add('on'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));home.classList.add('on');window.scrollTo(0,0);};
function show(i){document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('on',i===j));document.querySelectorAll('.nav button').forEach((b,j)=>b.classList.toggle('on',i===j));window.scrollTo(0,0);}
show(0);
</script>
</body>
</html>
