<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HETT talking points</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e3e0d8;
    --accent: #2f4d3a;
    --accent-soft: #e7ede8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }
  .header {
    padding: 20px 20px 12px;
    text-align: left;
  }
  .header .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 2px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 14px;
    padding: 8px 20px 4px;
    scrollbar-width: none;
  }
  .deck::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 86vw;
    max-width: 420px;
    scroll-snap-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 24px;
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .qnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .qnum.wide {
    font-size: 10px;
    letter-spacing: 0.01em;
  }
  .question {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 16px;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .link-line {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 16px;
  }
  .link-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .bullets li {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 10px;
    color: var(--ink);
    position: relative;
    padding-left: 16px;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.6;
  }
  .question strong { color: var(--ink); font-weight: 600; }
  .highlight {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.45;
    margin: 4px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .footer {
    padding: 6px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 0 28px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, width 0.2s;
  }
  .dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 20px 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">HETT 2026 &middot; opening panel prep &middot; spoken-word practice script</p>
    <h1>Talking points</h1>
    <p class="sub">Neighbourhood Health: From Framework to Function</p>
  </div>

  <p class="hint" id="hint">Swipe for the next question</p>

  <div class="deck" id="deck"></div>

  <div class="progress" id="progress"></div>

<script>
const data = [
  {
    "q": "Open",
    "title": "The view from neighbourhood level",
    "link": "I'm an applied philosopher, and somehow, I find myself working in NHS primary care.",
    "bullets": [
      "D&T Lead → Dorset coast PCN → **74,000 patients, five practices** → coastal, rural, ageing, deprived, beautiful",
      "Twenty years → playout director → BBC, Channel 4 → live news and sport",
      "Tape to server → NHS making the same shift → from the inside",
      "Working day → **demos** → smart triage, AVT, remote management platforms → **what does the patient get?**"
    ],
    "footerText": "Opening",
    "close": "I build for my neighbours until I hit my technical ceiling, then invite health tech companies to build the rest with me."
  },
  {
    "q": 1,
    "question": "The Neighbourhood Health Framework sets a clear ambition, but what **practical foundations** in **data, infrastructure, workforce, and system capability** are needed to deliver it **at scale**?",
    "title": "AVT and wearables",
    "link": "“Practical foundations” → national policy → AVT & wearables",
    "bullets": [
      "AVT → 18-month evaluation → no magic technology",
      "Who's the supplier? → UK company, UK servers, NHS links → **how funded?**",
      "Lexacom → not the loudest, best answers → founder came himself",
      "Wearables → data unseen, device + smartphone → **new inequality** → Google or Apple...?"
    ],
    "close": "The foundation isn't the technology. It's knowing who you're building with."
  },
  {
    "q": 2,
    "question": "How do we move from **fragmented systems** to **true interoperability** that enables **real-time collaboration** across **multidisciplinary neighbourhood teams**, and what **building blocks** must be in place **first**?",
    "title": "People first, then the market",
    "link": "Interoperability → does A talk to B → SystmOne → not the first building block",
    "bullets": [
      "People first → first month → library, garden centre cafe, the occasional pub",
      "Knew good services existed → couldn't find them → **design problem**",
      "INTs → front foot → Learning Lunches, Partnership Group → relationships first",
      "Systems slower → TPP & EMIS, now Enlivio → watching Medicus"
    ],
    "close": "Real interoperability might need real competition."
  },
  {
    "q": 3,
    "question": "What needs to change in how neighbourhood teams are **designed, supported, and connected** to ensure **genuine transformation** rather than simply **repackaging existing services**?",
    "title": "Thinking from different backgrounds",
    "link": "“Repackaging” → same people, same training, same thinking",
    "bullets": [
      "Design → different backgrounds",
      "AI → ethics, fairness, what we owe the person → applied philosophy → **never needed it more**",
      "Only half of it → support → confidence isn't a training module",
      "Well designed, supportive, human → **environment, not a module** → activity vs progress"
    ],
    "close": "Transformation doesn't come from new structures. It comes from new thinking inside them."
  },
  {
    "q": 4,
    "question": "How can **general practice data** be better leveraged to support **prevention, early intervention, and population health management**, and are **current EPRs equipped** to support this level of integration and complexity?",
    "title": "The space before demand",
    "link": "Awash with data → EPRs see demand at the appointment → the space before demand",
    "bullets": [
      "1 in 5 → social → loneliness, debt, unsafe relationship → already late",
      "Search online first → reception links, QR codes (pub toilet door), PCN website",
      "Every tap → anonymous signal → themes, as they happen",
      "No logins, no personal data → unmet need, early → **no surveillance**"
    ],
    "close": "EPRs tell us what people come in with. Neighbourhood signals tell us what they're living with."
  },
  {
    "q": 5,
    "question": "What are the key **operational barriers** to making neighbourhood health a reality, particularly around **trust, shared access, communication, governance, and role clarity**?",
    "title": "MyScribe",
    "link": "Trust, communication, governance → in consulting rooms, right now",
    "bullets": [
      "40 to 80% forgotten → recording covertly → phones, ChatGPT, smart glasses",
      "Voice recorder the NHS can trust → ask to record → **just to remember**",
      "Your appointment, your phone, your records → share with whoever → talk to it → **audio receipt**",
      "Be present → remember to do the remembering → fewer DNAs, fewer call backs"
    ],
    "close": "It's called MyScribe. And in a shameless bit of self-promotion: find me afterwards, or grab one of my cards."
  },
  {
    "q": 6,
    "question": "How can **co-production** between **solution providers and neighbourhood teams** drive more **meaningful adoption** of digital tools, and what **examples** demonstrate this **working successfully in practice**?",
    "title": "Co-production, the other way round",
    "link": "Co-production → the other way round",
    "bullets": [
      "Build to my ceiling → invite companies in",
      "MyScribe → Deepgram, Accuro, Patients Know Best → Shuru Tech engineers",
      "I brought them together → my neighbours' real problem"
    ],
    "close": "That's real co-production. It starts with the neighbourhood's problem, not the supplier's product."
  },
  {
    "q": 7,
    "question": "Given that many **determinants of health sit outside healthcare**, how can we **strengthen partnerships with local authorities and VCSE organisations** to deliver preventative support, improve outcomes, and reduce future demand on services?",
    "title": "A short answer, and a close",
    "link": "Keep it short → INT working already covered",
    "bullets": [
      "Voluntary sector → asked a lot of → **equal partner**",
      "Local authorities → others on the panel better placed",
      "Framework to function → know your neighbours → **get on and build**"
    ],
    "close": "In Weymouth and on Portland, that's what we're doing. We're building the gold standard in neighbourhood health. Come and find me."
  }
];

function md(t){
  const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
const totalQuestions = data.filter(d => typeof d.q === 'number').length;

data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  if (typeof d.q === 'number') {
    qnum.textContent = 'Q' + d.q;
  } else {
    qnum.textContent = d.q;
    qnum.classList.add('wide');
  }
  card.appendChild(qnum);

  if (d.question) {
    const question = document.createElement('p');
    question.className = 'question';
    question.innerHTML = md(d.question);
    card.appendChild(question);
  }

  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = d.title;
  card.appendChild(title);

  if (d.link) {
    const linkBox = document.createElement('div');
    linkBox.className = 'link-line';
    const label = document.createElement('span');
    label.className = 'link-label';
    label.textContent = 'Open';
    linkBox.appendChild(label);
    const lt=document.createElement('span'); lt.innerHTML=md(d.link); linkBox.appendChild(lt);
    card.appendChild(linkBox);
  }

  const ul = document.createElement('ul');
  ul.className = 'bullets';
  d.bullets.forEach(b => {
    const li = document.createElement('li');
    li.innerHTML = md(b);
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (d.close) {
    const highlight = document.createElement('p');
    highlight.className = 'highlight';
    highlight.innerHTML = '<span class="link-label">Close</span>' + md(d.close);
    card.appendChild(highlight);
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.textContent = d.footerText ? d.footerText : ('Question ' + d.q + ' of ' + totalQuestions);
  card.appendChild(footer);

  deck.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  progress.appendChild(dot);
});

progress.children[0].classList.add('active');

let hasScrolled = false;
deck.addEventListener('scroll', () => {
  if (!hasScrolled) {
    hasScrolled = true;
    hint.style.display = 'none';
  }
  const cardWidth = deck.children[0].getBoundingClientRect().width + 14;
  const idx = Math.min(data.length - 1, Math.max(0, Math.round(deck.scrollLeft / cardWidth)));
  Array.from(progress.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === idx);
  });
}, { passive: true });
</script>

</body>
</html>
