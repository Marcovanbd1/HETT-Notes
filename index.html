<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HETT talking points</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e3e0d8;
    --accent: #2f4d3a;
    --accent-soft: #e7ede8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }
  .header {
    padding: 20px 20px 12px;
    text-align: left;
  }
  .header .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 2px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 14px;
    padding: 8px 20px 4px;
    scrollbar-width: none;
  }
  .deck::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 86vw;
    max-width: 420px;
    scroll-snap-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 24px;
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .qnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .qnum.wide {
    font-size: 10px;
    letter-spacing: 0.01em;
  }
  .question {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 16px;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .link-line {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 16px;
  }
  .link-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .bullets li {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 10px;
    color: var(--ink);
    position: relative;
    padding-left: 16px;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.6;
  }
  .question strong { color: var(--ink); font-weight: 600; }
  .highlight {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.45;
    margin: 4px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .footer {
    padding: 6px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 0 28px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, width 0.2s;
  }
  .dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 20px 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">HETT 2026 &middot; opening panel prep &middot; spoken-word practice script</p>
    <h1>Talking points</h1>
    <p class="sub">Neighbourhood Health: From Framework to Function</p>
  </div>

  <p class="hint" id="hint">Swipe for the next question</p>

  <div class="deck" id="deck"></div>

  <div class="progress" id="progress"></div>

<script>
const data = [
  {
    "q": "Open",
    "title": "The view from neighbourhood level",
    "link": "I'll be honest about who I am and what I do.",
    "bullets": [
      "I'm an applied philosopher, and I lead **Digital and Transformation** for a PCN on the Dorset coast: **74,000 patients, five practices**.",
      "I look at what my neighbourhood is going through, and I build digital solutions that **close the gaps**.",
      "My working day is **endless demos**, with varying degrees of sales pressure: AVT, smart triage, remote patient management, wearables. And I always ask: **what does the patient get?**",
      "I build to my **technical ceiling**, then invite health tech companies to finish the build."
    ],
    "footerText": "Opening",
    "close": "So in each answer this morning, I'll tie it back to something we've built, or are building. Listen out for three: Neighbourhood Signals, Afternote, and MyScribe."
  },
  {
    "q": 1,
    "question": "The Neighbourhood Health Framework sets a clear ambition, but what **practical foundations** in **data, infrastructure, workforce, and system capability** are needed to deliver it **at scale**?",
    "title": "AVT and wearables",
    "link": "Voice holds great potential for healthcare. Over time, AVT will sink into the system and become the way we do things.",
    "bullets": [
      "Which means it becomes **infrastructure**. And if a private company is going to own part of it, **I want to know who they are**.",
      "Are they a UK company, with UK servers? Do they have NHS relationships? And **how are they funded?**",
      "Do they understand embedding AVT **across the neighbourhood**, not just in the GP consulting room?",
      "We spent **eighteen months** evaluating, and chose **Lexacom**. Their founder came down himself."
    ],
    "close": "We haven't rolled AVT out yet, deliberately. We'll make sure we get the practical foundations right. They come before the technology itself."
  },
  {
    "q": 2,
    "question": "How do we move from **fragmented systems** to **true interoperability** that enables **real-time collaboration** across **multidisciplinary neighbourhood teams**, and what **building blocks** must be in place **first**?",
    "title": "People first, then the market",
    "link": "Health, social care and the voluntary sector don't share a record. Before I joined the NHS, I assumed they already did. And the systems won't join up any time soon.",
    "bullets": [
      "So I started from the other end: **the person**. Where do they start, and how do they reach the right help, **whichever sector** it sits in?",
      "We built three simple routes in: **reception desk links**, **QR codes** where people are, like a pub toilet door, and our **PCN website**.",
      "Every one is designed **through an INT lens**: health, social care and the voluntary sector as **one team around the person**.",
      "It's two or three taps, with no logins. **One front door, three systems behind it.**"
    ],
    "close": "The patient shouldn't have to do the legwork of joining up those services."
  },
  {
    "q": 3,
    "question": "What needs to change in how neighbourhood teams are **designed, supported, and connected** to ensure **genuine transformation** rather than simply **repackaging existing services**?",
    "title": "Thinking from different backgrounds",
    "link": "You said “repackaging,” and that's what happens when we design teams with the same people, the same training and the same thinking.",
    "bullets": [
      "So we need to **design** teams with different backgrounds in them.",
      "With AI arriving, the hard questions are about **ethics, fairness, and what we owe the person**. That's applied philosophy, and **I've never needed mine more**."
    ],
    "close": "Transformation doesn't come from new structures. It comes from new thinking inside them. I'm still waiting for Google or Apple to make me their Applied Philosopher in Residence. They haven't called yet."
  },
  {
    "q": 4,
    "question": "How can **general practice data** be better leveraged to support **prevention, early intervention, and population health management**, and are **current EPRs equipped** to support this level of integration and complexity?",
    "title": "The space before demand",
    "link": "General practice data is incredibly rich. Decades of it, for almost everyone in the neighbourhood. But it was built for the appointment, not the population.",
    "bullets": [
      "It tells us what was treated. It rarely tells us what's going on in someone's life: **loneliness, debt, an unsafe relationship**.",
      "And our EPRs were designed around **one consultation at a time**. They're very good at recording demand, but **never designed to see it coming**.",
      "So we add what the record can't see. We call it **Neighbourhood Signals**: simple routes into support where people **live their lives**, where every tap leaves a **tiny, anonymous signal**, with no personal data.",
      "Put that **alongside the GP record**, and you start to see **the whole picture**."
    ],
    "close": "EPRs tell us what people come in with. Neighbourhood signals tell us what they're living with."
  },
  {
    "q": 5,
    "question": "What are the key **operational barriers** to making neighbourhood health a reality, particularly around **trust, shared access, communication, governance, and role clarity**?",
    "title": "MyScribe",
    "link": "The biggest trust barrier I see is this. What I'm seeing on the ground, and hearing from clinicians and patients, is that people are recording their appointments.",
    "bullets": [
      "They're using ChatGPT in their pocket, smart glasses, voice recorders on phones, with **no thought for what happens to that recording**.",
      "Clinicians are getting ambient scribes, and I think **patients should get their own**: a simple app on their phone.",
      "So we're building **the voice recorder the NHS can trust**. Your appointment, your record, on your phone.",
      "If you're a clinician, have you been recorded? How did it feel, and did they ask? And everyone else: **have you ever recorded a conversation**, covertly or openly?"
    ],
    "close": "Find me afterwards and ask me about MyScribe."
  },
  {
    "q": 6,
    "question": "How can **co-production** between **solution providers and neighbourhood teams** drive more **meaningful adoption** of digital tools, and what **examples** demonstrate this **working successfully in practice**?",
    "title": "Co-production, the other way round",
    "link": "I see co-production a bit differently. Usually, a supplier builds a product, then looks for an NHS site to try it on. I start with a problem in my neighbourhood, and then go looking for the companies to help me solve it.",
    "bullets": [
      "**MyScribe** is the example. We're speaking to **Deepgram** for their voice models, **Accuro** for their reach into the NHS, and **Patients Know Best**, because I'm all about patients holding their own records.",
      "And our team of AI engineers from **Shuru Tech** started on the actual build **yesterday**.",
      "I've **brought them together** around a problem my neighbours actually face."
    ],
    "close": "That's real co-production. It starts with the neighbourhood's problem, not the supplier's product."
  },
  {
    "q": 7,
    "question": "Given that many **determinants of health sit outside healthcare**, how can we **strengthen partnerships with local authorities and VCSE organisations** to deliver preventative support, improve outcomes, and reduce future demand on services?",
    "title": "A short answer, and a close",
    "link": "I've talked a lot about neighbourhood team working already.",
    "bullets": [
      "We're **asking a lot of the voluntary sector**, and they should be treated as an **equal partner**. On local authorities, **others on the panel** will no doubt give a better answer than me.",
      "For me, the **framework** is national policy, national surveys and the patient voice. The **function** is cracking on and **building for my neighbours**.",
      "And because this is health and care, that means building for when my neighbours are **tired, stressed or overwhelmed**. When you understand your patch like that, **you build things that look very different**.",
      "Like **Afternote**, sent to your phone straight after your appointment: **what just happened, what to watch out for, and what to do next**. These are starting to appear after private GP appointments. I think those of us who rely on the NHS **should get them too**."
    ],
    "close": "In Weymouth and on Portland, that's what we're doing. We're building the gold standard in neighbourhood health. Come and find me."
  }
];

function md(t){
  const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
const totalQuestions = data.filter(d => typeof d.q === 'number').length;

data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  if (typeof d.q === 'number') {
    qnum.textContent = 'Q' + d.q;
  } else {
    qnum.textContent = d.q;
    qnum.classList.add('wide');
  }
  card.appendChild(qnum);

  if (d.question) {
    const question = document.createElement('p');
    question.className = 'question';
    question.innerHTML = md(d.question);
    card.appendChild(question);
  }

  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = d.title;
  card.appendChild(title);

  if (d.link) {
    const linkBox = document.createElement('div');
    linkBox.className = 'link-line';
    const label = document.createElement('span');
    label.className = 'link-label';
    label.textContent = 'Open';
    linkBox.appendChild(label);
    const lt=document.createElement('span'); lt.innerHTML=md(d.link); linkBox.appendChild(lt);
    card.appendChild(linkBox);
  }

  const ul = document.createElement('ul');
  ul.className = 'bullets';
  d.bullets.forEach(b => {
    const li = document.createElement('li');
    li.innerHTML = md(b);
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (d.close) {
    const highlight = document.createElement('p');
    highlight.className = 'highlight';
    highlight.innerHTML = '<span class="link-label">Close</span>' + md(d.close);
    card.appendChild(highlight);
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.textContent = d.footerText ? d.footerText : ('Question ' + d.q + ' of ' + totalQuestions);
  card.appendChild(footer);

  deck.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  progress.appendChild(dot);
});

progress.children[0].classList.add('active');

let hasScrolled = false;
deck.addEventListener('scroll', () => {
  if (!hasScrolled) {
    hasScrolled = true;
    hint.style.display = 'none';
  }
  const cardWidth = deck.children[0].getBoundingClientRect().width + 14;
  const idx = Math.min(data.length - 1, Math.max(0, Math.round(deck.scrollLeft / cardWidth)));
  Array.from(progress.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === idx);
  });
}, { passive: true });
</script>

</body>
</html>
