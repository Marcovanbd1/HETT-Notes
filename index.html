<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HETT panel cards</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--soft:#6b6862;--line:#e3e0d8;--accent:#2f4d3a;--accent-soft:#e7ede8;--close:#f3ede1;--close-ink:#5a4520;}
@media (prefers-color-scheme: dark){:root{--bg:#141412;--card:#1e1e1b;--ink:#f1efe9;--soft:#a39f96;--line:#33322e;--accent:#9cc3a8;--accent-soft:#223028;--close:#2b2518;--close-ink:#e6cf9c;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;line-height:1.2;cursor:pointer}
.nav button b{display:block;font-size:15px;color:var(--accent)}
.nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav button.on b{color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card.on{display:block}
.head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.head .n{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
.head .t{font-size:20px;font-weight:650}
.q{font-size:13.5px;line-height:1.5;color:var(--soft);margin:0 0 16px;border-left:2px solid var(--line);padding-left:10px}
.q strong{color:var(--ink);font-weight:600}
.lab{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:5px}
.open{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;font-weight:600;margin-bottom:16px}
ul{list-style:none;margin:0 0 16px;padding:0}
li{position:relative;padding:10px 0 10px 22px;font-size:17px;line-height:1.45;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li::before{content:"";position:absolute;left:4px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
li strong{font-weight:700}
li em{font-style:normal;color:var(--soft);font-size:16px}
.close{background:var(--close);color:var(--close-ink);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.45;font-weight:600}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div class="wrap" id="wrap"></div>
<script>
const data = [
 {
  "q": 1,
  "tag": "Foundations",
  "question": "The Neighbourhood Health Framework sets a clear ambition, but what **practical foundations** in **data, infrastructure, workforce, and system capability** are needed to deliver it **at scale**?",
  "open": "When I hear “practical foundations,” I think about what happens when you go to the doctor for something small. More specifically, what happens when you leave.",
  "bullets": [
   "Between **40 and 80 percent** of what's said in a consultation is forgotten almost immediately, and much of what's remembered is **remembered wrong**.",
   "So we're building **Afternote**: a message sent to your phone straight after your appointment. **What just happened, what to watch out for, and what to do next.**",
   "It means **fewer missed appointments**, and fewer calls back into the practice because someone can't remember a detail.",
   "These are starting to appear after private GP appointments. I think **those of us who rely on the NHS should get them too**."
  ],
  "close": "The most practical foundation of all is making sure people leave knowing what to do next."
 },
 {
  "q": 2,
  "tag": "Interoperability",
  "question": "How do we move from **fragmented systems** to **true interoperability** that enables **real-time collaboration** across **multidisciplinary neighbourhood teams**, and what **building blocks** must be in place **first**?",
  "open": "For me, the real test of interoperability is triage. When someone asks for help, can we get them to the right person, whichever sector they sit in?",
  "bullets": [
   "Smart triage is arriving in general practice, and it's a real step forward. But **triage into primary care doesn't go far enough**.",
   "That same triage should move people **across the whole INT**: health, social care and the voluntary sector, to **meet people where they are**.",
   "Around **one in five** people who see their GP are there for something non-medical: **loneliness, debt, an unsafe relationship**. We need to reach them **before they book to see the doctor**.",
   "So if you're building a smart triage platform, please, **put in a social filter**, and help us **shape demand early**."
  ],
  "close": "Smart triage shouldn't just sort the queue for the GP. It should get people to the right help, wherever it sits."
 },
 {
  "q": 3,
  "tag": "Transformation",
  "question": "What needs to change in how neighbourhood teams are **designed, supported, and connected** to ensure **genuine transformation** rather than simply **repackaging existing services**?",
  "open": "Design, support and connection all matter, but I'd start with design. You said “repackaging,” and that's what happens when we design teams with the same people, the same training and the same thinking.",
  "bullets": [
   "So we need to design teams with **different backgrounds** in them, not just more of the same.",
   "Because with AI arriving, the hard questions aren't just technical. They're about **ethics, fairness, and what we owe the person** on the other end.",
   "That's applied philosophy. I studied it a long time ago, and I've **never needed it more** than I do now."
  ],
  "close": "Transformation doesn't come from new structures. It comes from new thinking inside them."
 },
 {
  "q": 4,
  "tag": "GP data",
  "question": "How can **general practice data** be better leveraged to support **prevention, early intervention, and population health management**, and are **current EPRs equipped** to support this level of integration and complexity?",
  "open": "We're awash with general practice data. What I'd like to talk about is the data that doesn't really get looked at. I call it the space before demand.",
  "bullets": [
   "Because we built simple routes into support, **every search or tap** sends up a **tiny, anonymous signal**.",
   "Thousands of those signals tell us **what the neighbourhood is searching for**. Or really, **what it's going through**.",
   "There are **no logins, no accounts and no personal data**. Just patterns.",
   "The project is called **Neighbourhood Signals**, and I see it as a piece of **civic architecture**."
  ],
  "close": "If we can listen to our neighbourhoods, we have a civic responsibility to do so."
 },
 {
  "q": 5,
  "tag": "Barriers",
  "question": "What are the key **operational barriers** to making neighbourhood health a reality, particularly around **trust, shared access, communication, governance, and role clarity**?",
  "open": "All five of those barriers are real, but the biggest one I see on the ground is trust. I'm hearing from clinicians and patients that people are recording their appointments.",
  "bullets": [
   "Because **40 to 80 percent** of a consultation is forgotten, they're using ChatGPT in their pocket, smart glasses, voice recorders on their phones, with **no thought for what happens to that recording**.",
   "Clinicians across the NHS are getting ambient scribes. I think **patients should get their own**: a simple app on their phone.",
   "So we're building **the voice recorder the NHS can trust**. Your appointment, your record, on your phone.",
   "If you're a clinician, have you ever been recorded? How did it feel, and did they ask? And for everyone else: **have you ever recorded a conversation**, covertly or openly?"
  ],
  "close": "Find me afterwards and ask me about MyScribe."
 },
 {
  "q": 6,
  "tag": "Co-production",
  "question": "How can **co-production** between **solution providers and neighbourhood teams** drive more **meaningful adoption** of digital tools, and what **examples** demonstrate this **working successfully in practice**?",
  "open": "I see co-production a bit differently. Usually, a supplier builds a product, then looks for an NHS site to try it on. I start with a problem in my neighbourhood, and then go looking for the companies to help me solve it.",
  "bullets": [
   "MyScribe is the example. We're speaking to **Deepgram** for their voice models, **Accuro** for their reach into the NHS, and **Patients Know Best**, because I'm all in favour of **the person holding their own record**.",
   "And our team of AI engineers from **Shuru Tech** started on the actual build **yesterday**.",
   "I've **brought them together** around a problem my neighbours are actually facing, rather than a product looking for a home."
  ],
  "close": "That's real co-production. So if you think you can bring something to MyScribe that those companies can't, please come and find me, and be part of it."
 },
 {
  "q": 7,
  "tag": "Partnerships",
  "question": "Given that many **determinants of health sit outside healthcare**, how can we **strengthen partnerships with local authorities and VCSE organisations** to deliver preventative support, improve outcomes, and reduce future demand on services?",
  "open": "Others on this panel have far more experience of working with local authorities than I do, so I'll leave that to them. But I'd like to tell you about a partnership of a different kind.",
  "bullets": [
   "We've set up a community interest company: **a nurse, a social worker, a counselling psychologist and an applied philosopher**, who've come together to tackle the problems in our neighbourhood.",
   "We've developed a **four-person review process**. It takes whatever the system says to people, and **softens it**, for people who could well be **tired, stressed or overwhelmed**.",
   "We call it **the CoLab Lens**. **Wherever a machine talks to a person, that's where the lens sits.**",
   "We put enormous rigour into everything clinical. We're bringing that same **clinical rigour to the way we talk to patients**. Or really, **to people**."
  ],
  "close": "In Weymouth and on Portland, that's what we're doing. We're building the gold standard in neighbourhood health. Come and find me."
 }
];
function md(t){const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return e.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
const nav=document.getElementById('nav'),wrap=document.getElementById('wrap');
data.forEach((d,i)=>{
  const bt=document.createElement('button');bt.innerHTML='<b>Q'+d.q+'</b>'+d.tag;bt.onclick=()=>show(i);nav.appendChild(bt);
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="head"><span class="n">Q'+d.q+'</span><span class="t">'+d.tag+'</span></div>'+
    '<p class="q">'+md(d.question)+'</p>'+
    '<div class="open"><span class="lab">Open</span>'+md(d.open)+'</div>'+
    '<ul>'+d.bullets.map(b=>'<li>'+md(b)+'</li>').join('')+'</ul>'+
    '<div class="close"><span class="lab">Close</span>'+md(d.close)+'</div>';
  wrap.appendChild(c);
});
const home=document.createElement('button');home.innerHTML='<b>All</b>list';nav.appendChild(home);
home.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.add('on'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));home.classList.add('on');window.scrollTo(0,0);};
function show(i){document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('on',i===j));document.querySelectorAll('.nav button').forEach((b,j)=>b.classList.toggle('on',i===j));window.scrollTo(0,0);}
show(0);
</script>
</body>
</html>
