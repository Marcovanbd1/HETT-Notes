<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HETT talking points</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e3e0d8;
    --accent: #2f4d3a;
    --accent-soft: #e7ede8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }
  .header {
    padding: 20px 20px 12px;
    text-align: left;
  }
  .header .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 2px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 14px;
    padding: 8px 20px 4px;
    scrollbar-width: none;
  }
  .deck::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 86vw;
    max-width: 420px;
    scroll-snap-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 24px;
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .qnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .question {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 18px;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  .bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .bullets li {
    font-size: 15px;
    line-height: 1.55;
    padding-left: 18px;
    position: relative;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .footer {
    padding: 6px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 0 28px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, width 0.2s;
  }
  .dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 20px 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">HETT 2026 &middot; opening panel prep</p>
    <h1>Talking points</h1>
    <p class="sub">Neighbourhood Health: From Framework to Function</p>
  </div>

  <p class="hint" id="hint">Swipe for the next question</p>

  <div class="deck" id="deck"></div>

  <div class="progress" id="progress"></div>

<script>
const data = [
  {
    q: 1,
    question: "Practical foundations needed to deliver the framework at scale.",
    title: "AVT evaluation \u2192 Lexacom",
    bullets: [
      "18-month pre-procurement evaluation of NHS registry AVT suppliers.",
      "No magic technology \u2014 the supplier matters as much as the spec.",
      "Criteria: protect practices from risk, serve people when they're tired, stressed, or overwhelmed.",
      "Landed on Lexacom \u2014 UK company, UK servers, privately owned, commits to an afternote after every consultation."
    ]
  },
  {
    q: 2,
    question: "Moving from fragmented systems to true interoperability \u2014 what building blocks come first.",
    title: "The INT lens",
    bullets: [
      "Interoperability at neighbourhood level is relational before it's technical.",
      "Weekly learning lunches, monthly INT partnership groups.",
      "The Local Social QR code was built through that lens."
    ]
  },
  {
    q: 3,
    question: "How neighbourhood teams need to be designed, supported, and connected.",
    title: "Removing friction",
    bullets: [
      "Started with: what if support was ridiculously easy to reach \u2014 everywhere, every phone, every lamp post.",
      "Built three tools: the PCN website, QuickLinks, and The Local Social.",
      "None ask for a name or login \u2014 friction stripped to a minimum."
    ]
  },
  {
    q: 4,
    question: "Can general practice data be better leveraged \u2014 are current EPRs equipped for it.",
    title: "SystmOne vs Neighbourhood Signals",
    bullets: [
      "Sit in a SystmOne county / ICB area; unclear whether the single-platform aspiration reaches EPRs.",
      "SystmOne data is already shaped and triaged by the time it's seen.",
      "Neighbourhood Signals is raw, closer to the person \u2014 a real-time picture of unmet need."
    ]
  },
  {
    q: 5,
    question: "Key operational barriers \u2014 trust, shared access, governance, role clarity.",
    title: "Protecting practices from risk",
    bullets: [
      "Rigorous supplier evaluation to protect practices from risk.",
      "Choosing suppliers who serve people at their most overwhelmed.",
      "MyScribe as the trusted alternative to covert recording."
    ]
  },
  {
    q: 6,
    question: "How co-production between solution providers and neighbourhood teams drives adoption.",
    title: "MyScribe",
    bullets: [
      "Patients are already recording covertly \u2014 Meta Glasses, voice notes, ChatGPT.",
      "Built the one the system trusts: a nurse, a psychologist, a social worker, an applied philosopher, and a national AVT partner.",
      "Publicly invited health tech companies to come inside the NHS and co-build, via LinkedIn."
    ]
  },
  {
    q: 7,
    question: "Strengthening partnerships with local authorities and VCSE organisations.",
    title: "Applied philosophy",
    bullets: [
      "Across multi-agency working, applied philosophy training has been the greatest strength.",
      "It's a translation problem between institutions as much as a funding or structure problem."
    ]
  }
];

const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');

data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  qnum.textContent = 'Q' + d.q;
  card.appendChild(qnum);

  const question = document.createElement('p');
  question.className = 'question';
  question.textContent = d.question;
  card.appendChild(question);

  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = d.title;
  card.appendChild(title);

  const ul = document.createElement('ul');
  ul.className = 'bullets';
  d.bullets.forEach(b => {
    const li = document.createElement('li');
    li.textContent = b;
    ul.appendChild(li);
  });
  card.appendChild(ul);

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.textContent = 'Question ' + d.q + ' of ' + data.length;
  card.appendChild(footer);

  deck.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  progress.appendChild(dot);
});

progress.children[0].classList.add('active');

let hasScrolled = false;
deck.addEventListener('scroll', () => {
  if (!hasScrolled) {
    hasScrolled = true;
    hint.style.display = 'none';
  }
  const cardWidth = deck.children[0].getBoundingClientRect().width + 14;
  const idx = Math.min(data.length - 1, Math.max(0, Math.round(deck.scrollLeft / cardWidth)));
  Array.from(progress.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === idx);
  });
}, { passive: true });
</script>

</body>
</html>
