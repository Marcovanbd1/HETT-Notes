<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HETT talking points</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e3e0d8;
    --accent: #2f4d3a;
    --accent-soft: #e7ede8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }
  .header {
    padding: 20px 20px 12px;
    text-align: left;
  }
  .header .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 2px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 14px;
    padding: 8px 20px 4px;
    scrollbar-width: none;
  }
  .deck::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 86vw;
    max-width: 420px;
    scroll-snap-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 24px;
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .qnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .qnum.wide {
    font-size: 10px;
    letter-spacing: 0.01em;
  }
  .question {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 16px;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .link-line {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 16px;
  }
  .link-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .bullets li {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .highlight {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.45;
    margin: 4px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .footer {
    padding: 6px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 0 28px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, width 0.2s;
  }
  .dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 20px 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">HETT 2026 &middot; opening panel prep &middot; spoken-word practice script</p>
    <h1>Talking points</h1>
    <p class="sub">Neighbourhood Health: From Framework to Function</p>
  </div>

  <p class="hint" id="hint">Swipe for the next question</p>

  <div class="deck" id="deck"></div>

  <div class="progress" id="progress"></div>

<script>
const data = [
  {
    q: "Open",
    title: "The view from neighbourhood level",
    bullets: [
      "Applied Philosopher, working in NHS primary care.",
      "Most of this panel will be carried by people with more experience of the national picture \u2014 I'm here to show what it looks like at neighbourhood level.",
      "Lead Digital & Transformation for a primary care network on the Dorset coast: 74,000 patients, 5 GP practices.",
      "Coastal, rural, an ageing population, among the most deprived parts of the country \u2014 though it rarely feels that way, because it's so beautiful.",
      "There are problems to fix all over primary care. I find them and build towards solving them \u2014 and that's only possible at neighbourhood level.",
      "With everything I build, I ask one question first: what does the patient get?",
      "I build digital things for my neighbours myself, until I hit my technical ceiling \u2014 then I use LinkedIn to invite health tech companies inside the NHS to build the rest with me."
    ],
    highlight: "In Weymouth and on Portland, we're building the gold standard in neighbourhood health.",
    footerText: "Opening"
  },
  {
    q: 1,
    question: "The Neighbourhood Health Framework sets a clear ambition, but what practical foundations in data, infrastructure, workforce, and system capability are needed to deliver it at scale?",
    title: "Afternote",
    link: "When I hear \u201cpractical foundations,\u201d I think about the most basic moment there is: what happens when you leave the room after seeing your doctor.",
    bullets: [
      "Roughly half of what's discussed in a GP consultation is forgotten, or remembered wrong, by the time the patient gets home.",
      "Afternote: your clinician's words, made readable for your hardest day. A plain language note from your appointment or your hospital stay, made for reading at home. Every word comes from what your clinician said.",
      "It's an open format. Any team can adopt it \u2014 this is the hospital-to-community shift the Ten Year Plan talks about, made real in one neighbourhood first.",
      "Fewer things forgotten means fewer calls back into the practice, and fewer DNAs \u2014 which cost the NHS over \u00a3200 million a year.",
      "We place enormous rigour on everything clinical, and rightly so. I think that same rigour should extend to patient comms, to how we actually speak to patients. That's part of why we formed a CIC: a nurse, a social worker, a counselling psychologist, and an applied philosopher, who've spent their working lives understanding how words land with people."
    ],
    highlight: "So if any of you are listening: come and talk to me."
  },
  {
    q: 2,
    question: "How do we move from fragmented systems to true interoperability that enables real-time collaboration across multidisciplinary neighbourhood teams, and what building blocks must be in place first?",
    title: "MyScribe",
    link: "Let's start with \u201cinteroperability,\u201d because I think we use that word without ever asking what it actually means. Usually it means: can System A talk to System B.",
    bullets: [
      "But every AVT sweeping into the NHS right now still locks the recording inside whichever system bought it. That's still just System A talking to System B.",
      "Between 40 and 80 percent of a medical appointment is forgotten immediately. So we built MyScribe. Your appointment. Your record. On your phone.",
      "The appointment goes home with the person who was in it."
    ],
    highlight: "That's a different kind of interoperability. One person who never has to ask permission to access their own conversation."
  },
  {
    q: 3,
    question: "What needs to change in how neighbourhood teams are designed, supported, and connected to ensure genuine transformation rather than simply repackaging existing services?",
    title: "Policy fluency, and how I work",
    link: "You said \u2018repackaging\u2019 \u2014 that's exactly the risk I watch for.",
    bullets: [
      "I know the Ten Year Health Plan, the Neighbourhood Health Framework, and the Fuller Stocktake well. None of them are short of ambition.",
      "What's missing isn't another framework. It's energy and new thinking, applied at the level people actually live their lives.",
      "I come from a very different background to most people in these teams. An applied philosopher, not a clinician or an NHS manager. I think that difference is useful, not a gap to close.",
      "In my first week in this role, I contacted the NHS Dorset CEO directly. I had no real place doing that. I didn't wait for permission."
    ],
    highlight: "The people who understand their neighbourhood best should just get on and build for their neighbours \u2014 because people on Portland are not the same as people in Sunderland."
  },
  {
    q: 4,
    question: "How can general practice data be better leveraged to support prevention, early intervention, and population health management, and are current EPRs equipped to support this level of integration and complexity?",
    title: "Neighbourhood Signals",
    link: "Honestly, I'm not sure current EPRs were built for this level of integration.",
    bullets: [
      "We're awash with data. But that data has already been shaped and triaged for the clinical encounter it was recorded for \u2014 by the time you see it, the moment before it has gone.",
      "We wanted to hear the neighbourhood before it reaches crisis. Neighbourhood Signals reads neighbourhood activity for themes of unmet need and puts it on a public dashboard, so the Integrated Neighbourhood Team can act early.",
      "Ninety-one day pilot. Three signal clusters, already surfaced."
    ],
    highlight: "That's the sickness-to-prevention shift, working."
  },
  {
    q: 5,
    question: "What are the key operational barriers to making neighbourhood health a reality, particularly around trust, shared access, communication, governance, and role clarity?",
    title: "Lexacom",
    link: "For us, the sharpest version of trust, shared access, and governance has been choosing an AVT supplier.",
    bullets: [
      "We ran an 18-month pre-procurement evaluation against the NHS AVT Supplier Registry, shortlisting four: Lexacom, TORTUS (via X-on Health), Tandem (via Accurx), and Heidi Health.",
      "We landed on Lexacom, and it wasn't close. UK company, UK servers, privately owned rather than VC-backed, and an existing relationship across general practice the others don't have yet.",
      "If we're paying for a piece of tech, I want to get as much value out of it as possible. We don't just switch it on and hope \u2014 we make suppliers work for that value."
    ],
    highlight: "Their founder came to the demo himself, with his implementation and training team, rather than sending a sales rep. That told us more about governance than any spec sheet did."
  },
  {
    q: 6,
    question: "How can co-production between solution providers and neighbourhood teams drive more meaningful adoption of digital tools, and what examples demonstrate this working successfully in practice?",
    title: "CoLab Lens",
    link: "You'll remember that CIC I mentioned earlier. This is where they do their sharpest work.",
    bullets: [
      "Patients are already recording their appointments, on their phones, into ChatGPT, without any say over what happens to it afterwards.",
      "So the honest problem wasn't \u2018should this exist.\u2019 It already does. It was: who shapes it so it can be trusted.",
      "That's the CoLab Lens: a checking layer for wherever a machine speaks to a person. Four professional perspectives \u2014 a nurse, a social worker, a counselling psychologist, and an applied philosopher \u2014 looking through five dimensions of emotional architecture. It works only with what was said, and softens clinical language until it actually helps the person receiving it.",
      "It's held by Neighbourhood CoLab CIC. Asset locked. Not something a shareholder can walk off with.",
      "I put the invitation out publicly on LinkedIn \u2014 health tech companies, come and help me finish this. Two answered: Accuro, the transcription supplier to the GMC, backing MyScribe commercially. Shuru Tech, an engineering team building it alongside us, for free, to get a genuine NHS foothold."
    ],
    highlight: "That's what co-production looks like in practice."
  },
  {
    q: 7,
    question: "Given that many determinants of health sit outside healthcare, how can we strengthen partnerships with local authorities and VCSE organisations to deliver preventative support, improve outcomes, and reduce future demand on services?",
    title: "Seeing the whole person",
    link: "You're right that most determinants of health sit outside healthcare. Most days in general practice, so does the appointment.",
    bullets: [
      "National survey data shows roughly 1 in 5 GP appointments aren't for a medical problem at all. They're for loneliness, debt, or an unsafe relationship.",
      "Applied philosophy training is my greatest strength here, because this isn't really a funding or structure problem \u2014 it's a translation problem between institutions that speak different languages about the same person."
    ],
    highlight: "That's the gold standard: not one service doing more, but a neighbourhood that finally sees the whole person."
  }
];

const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
const totalQuestions = data.filter(d => typeof d.q === 'number').length;

data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  if (typeof d.q === 'number') {
    qnum.textContent = 'Q' + d.q;
  } else {
    qnum.textContent = d.q;
    qnum.classList.add('wide');
  }
  card.appendChild(qnum);

  if (d.question) {
    const question = document.createElement('p');
    question.className = 'question';
    question.textContent = d.question;
    card.appendChild(question);
  }

  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = d.title;
  card.appendChild(title);

  if (d.link) {
    const linkBox = document.createElement('div');
    linkBox.className = 'link-line';
    const label = document.createElement('span');
    label.className = 'link-label';
    label.textContent = 'Opening line \u2014 links question to answer';
    linkBox.appendChild(label);
    linkBox.appendChild(document.createTextNode(d.link));
    card.appendChild(linkBox);
  }

  const ul = document.createElement('ul');
  ul.className = 'bullets';
  d.bullets.forEach(b => {
    const li = document.createElement('li');
    li.textContent = b;
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (d.highlight) {
    const highlight = document.createElement('p');
    highlight.className = 'highlight';
    highlight.textContent = d.highlight;
    card.appendChild(highlight);
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.textContent = d.footerText ? d.footerText : ('Question ' + d.q + ' of ' + totalQuestions);
  card.appendChild(footer);

  deck.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  progress.appendChild(dot);
});

progress.children[0].classList.add('active');

let hasScrolled = false;
deck.addEventListener('scroll', () => {
  if (!hasScrolled) {
    hasScrolled = true;
    hint.style.display = 'none';
  }
  const cardWidth = deck.children[0].getBoundingClientRect().width + 14;
  const idx = Math.min(data.length - 1, Math.max(0, Math.round(deck.scrollLeft / cardWidth)));
  Array.from(progress.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === idx);
  });
}, { passive: true });
</script>

</body>
</html>
