<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HETT talking points</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #e3e0d8;
    --accent: #2f4d3a;
    --accent-soft: #e7ede8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }
  .header {
    padding: 20px 20px 12px;
    text-align: left;
  }
  .header .eyebrow {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 2px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 14px;
    padding: 8px 20px 4px;
    scrollbar-width: none;
  }
  .deck::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 86vw;
    max-width: 420px;
    scroll-snap-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 24px;
    min-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .qnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .qnum.wide {
    font-size: 10px;
    letter-spacing: 0.01em;
  }
  .question {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 16px;
    border-left: 2px solid var(--line);
    padding-left: 12px;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .link-line {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 16px;
  }
  .link-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .bullets {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
  }
  .bullets li {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .highlight {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1.45;
    margin: 4px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .footer {
    padding: 6px 0 0;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 16px 0 28px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s, width 0.2s;
  }
  .dot.active {
    background: var(--accent);
    width: 16px;
    border-radius: 3px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 20px 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">HETT 2026 &middot; opening panel prep &middot; spoken-word practice script</p>
    <h1>Talking points</h1>
    <p class="sub">Neighbourhood Health: From Framework to Function</p>
  </div>

  <p class="hint" id="hint">Swipe for the next question</p>

  <div class="deck" id="deck"></div>

  <div class="progress" id="progress"></div>

<script>
const data = [
  {
    q: "Open",
    title: "The view from neighbourhood level",
    bullets: [
      "I'm an Applied Philosopher, working in NHS primary care, and I'm here to show what neighbourhood health looks like at neighbourhood level.",
      "I'm the Digital and Transformation Lead for a primary care network on the Dorset coast: 74,000 patients, five GP practices. Coastal, rural, ageing, and among the most deprived parts of the country, though it rarely feels that way, because it's so beautiful.",
      "Before the NHS, I spent twenty years in broadcast television, separating signal from noise. While I was there, the industry moved from tape to server, analogue to digital. Now the NHS is making the same shift, and I'm living through it again, from the inside.",
      "It's a new kind of role in primary care. No one's done it for long enough to tell me how it should be done, which gives me room to be creative. The day to day is finding digital solutions to my neighbourhood's problems: smart triage, ambient voice, remote monitoring, wearables. Which means endless demos from many of the companies in this room. Varying degrees of sales pressure. It's been fascinating.",
      "With everything I build, I ask one question first: what does the patient get? I build for my neighbours myself, until I hit my technical ceiling. Then I invite health tech companies to build the rest with me."
    ],
    highlight: "In Weymouth and on Portland, we're building the gold standard in neighbourhood health.",
    footerText: "Opening"
  },
  {
    q: 1,
    question: "The Neighbourhood Health Framework sets a clear ambition, but what practical foundations in data, infrastructure, workforce, and system capability are needed to deliver it at scale?",
    title: "AVT and wearables",
    link: "When I hear \u201cpractical foundations,\u201d I go straight to what national policy has actually asked us to do on digital. The Ten Year Plan points to two things: ambient voice technology and wearables.",
    bullets: [
      "In primary care, I spent eighteen months on a pre-procurement evaluation of the AVT suppliers on the NHS registry. You'll have heard the names: Heidi, TORTUS, Tandem, Lexacom. What I learned is that there's no magic technology.",
      "So I became more interested in who the supplier was. Are they a UK company, with UK servers? Do they have existing NHS relationships? And, importantly, how are they funded?",
      "We settled on Lexacom. Not the loudest in the room, but they gave the best answers to my questions. And it wasn't a sales rep who came to see us. It was the founder and MD, Dr Andrew Whiteley, who visited in person to demo and to understand how our teams actually work.",
      "Wearables are harder. I haven't yet found one that passes those same questions for my patch. Most of what's out there sends people's health data somewhere they can't see, and most of it assumes you can afford the device and the smartphone to go with it.",
      "In one of the most deprived parts of the country, that's not a foundation. That's a new inequality. I'd love to build something that works for everyone. So if that's you, come and find me."
    ],
    highlight: "The foundation isn't the technology. It's knowing who you're building with."
  },
  {
    q: 2,
    question: "How do we move from fragmented systems to true interoperability that enables real-time collaboration across multidisciplinary neighbourhood teams, and what building blocks must be in place first?",
    title: "The Local Social",
    link: "When I hear \u201cinteroperability,\u201d we usually mean: does System A talk to System B? At PCN level, does it talk to SystmOne? That matters. But I don't think it's the first building block.",
    bullets: [
      "I came into the NHS recently enough that I've never known anything other than Integrated Neighbourhood Teams: health, social care, and the voluntary and community sector working together to wrap around the person. In Weymouth and Portland, we have weekly Learning Lunches and a monthly Integrated Neighbourhood Partnership Group. The relationships came first.",
      "Then we built the digital routes to match. I started with a thought experiment. What would happen if we made support ridiculously easy to reach? On every lamppost, every phone, every bus stop. Would services be overwhelmed? Or would the place feel more held?",
      "So we built The Local Social, a digital inclusion project. It's a QR code that's setting agnostic, which is a fancy way of saying we put simple routes into support where people actually are. On the back of a pub toilet door. On a supermarket noticeboard. On your fridge. On tote bags.",
      "It opens with one question, \u201cWhat's going on?\u201d, and five simple choices. Support is two or three taps of a thumb away. No filters, no dropdowns, no intelligent search navigation tool. No training needed. It's painfully intuitive."
    ],
    highlight: "The patient shouldn't have to be the integration layer."
  },
  {
    q: 3,
    question: "What needs to change in how neighbourhood teams are designed, supported, and connected to ensure genuine transformation rather than simply repackaging existing services?",
    title: "Thinking from different backgrounds",
    link: "You said \u201crepackaging,\u201d and I think that's what happens when we design neighbourhood teams with the same people, the same training and the same thinking we've always had. You get the same services with a new name on the door.",
    bullets: [
      "What's needed is innovative and creative thinking from different backgrounds. I trained in applied philosophy and spent twenty years working in systems inside television broadcast. It's been invaluable.",
      "You've already heard it in action this morning. The Local Social started as a philosophical thought experiment. The AVT evaluation came from years of managing broadcast suppliers, where you learn to ask who you're really dealing with, not just what the demo looks like.",
      "And it changes how we support teams. We talk about digital confidence as if it can be delivered through training modules. I don't think it can. People become confident through the lived experience of systems that are well designed, supportive and human. Confidence is an outcome of the environment, not a module. Otherwise we risk scaling activity rather than progress.",
      "I'll be honest: some days a different background feels like a superpower. Other days it feels like the system doesn't quite know what to do with me. But that's the point. If neighbourhood teams are going to be genuinely new, we have to design them to include people who think differently, and then make room for them to do it."
    ],
    highlight: "Transformation doesn't come from new structures. It comes from new thinking inside them."
  },
  {
    q: 4,
    question: "How can general practice data be better leveraged to support prevention, early intervention, and population health management, and are current EPRs equipped to support this level of integration and complexity?",
    title: "Neighbourhood Signals",
    link: "We're awash with data. And the NHS, and our EPRs, are really good at understanding demand at the point it becomes an appointment or a referral. That's what they were built for. We wanted to look at the space before demand.",
    bullets: [
      "Around one in five people who see their GP are there for something that's primarily social: loneliness, debt, an unsafe relationship. By the time that becomes an appointment, it's already late.",
      "Remember The Local Social, and \u201cWhat's going on?\u201d Every tap leaves a tiny, anonymous signal of what people in my neighbourhood are looking for help with. Put together, those signals show us what the neighbourhood is actually going through, in close to real time.",
      "We call it Neighbourhood Signals. It gives us visibility of unmet need, without any surveillance."
    ],
    highlight: "EPRs tell us what people come in with. Neighbourhood Signals tells us what they're living with."
  },
  {
    q: 5,
    question: "What are the key operational barriers to making neighbourhood health a reality, particularly around trust, shared access, communication, governance, and role clarity?",
    title: "Communicating with patients",
    link: "Communication is the barrier I'd pick, but not the one we usually mean. We talk a lot about teams communicating with each other. I'm more worried about how we communicate with patients.",
    bullets: [
      "Between 40 and 80 percent of what's said in a medical consultation is forgotten almost immediately, and much of what's remembered is remembered wrong.",
      "So we're building a next steps document that lands on your phone after your GP appointment, before you've reached the car park. What just happened. What to watch out for. What to do next. In your clinician's words, made readable.",
      "And what it leads to is practical. Fewer missed appointments. Fewer calls back into the practice because someone can't remember a detail. That's time given back to the practice team, and to patients.",
      "This is starting to appear after private GP appointments. I think patients relying on the NHS deserve the same."
    ],
    highlight: "The communication barrier that matters most isn't between organisations. It's between the consulting room and the car park."
  },
  {
    q: 6,
    question: "How can co-production between solution providers and neighbourhood teams drive more meaningful adoption of digital tools, and what examples demonstrate this working successfully in practice?",
    title: "MyScribe",
    link: "At the start I said I build for my neighbours until I hit my technical ceiling, then invite health tech companies inside the NHS to help me finish the build. This is what that looks like.",
    bullets: [
      "Clinicians across the NHS are about to get ambient voice technology. So I asked my usual question: what does the patient get?",
      "Why don't we give them their own ambient scribe, in their pocket, for any appointment? And actually, for every conversation that matters. A memory aid that goes with you to the important conversations, and gives you a summary on your phone afterwards of what happened.",
      "And that changes the conversation itself. You can actually be present. No scribbled notes. No trying to hold it all in your head. You don't have to remember to do the remembering. It's a real shift, and my bet is that this is the direction voice technology is moving in.",
      "We know patients are already recording their appointments, with their phones, ChatGPT, even smart glasses, and often covertly. So we're building the voice recorder the NHS can trust.",
      "It's called MyScribe. Accuro and Shuru Tech are building it with me, and it's been shaped by a nurse, a counselling psychologist, a social worker, and an applied philosopher. That's our neighbourhood co-production."
    ],
    highlight: "For every conversation that matters."
  },
  {
    q: 7,
    question: "Given that many determinants of health sit outside healthcare, how can we strengthen partnerships with local authorities and VCSE organisations to deliver preventative support, improve outcomes, and reduce future demand on services?",
    title: "A short answer, and a close",
    link: "I've talked a lot this morning about Integrated Neighbourhood Team working, so I'll keep this short.",
    bullets: [
      "I'll just say that I think we're asking a lot of the voluntary and community sector, and we need to treat them as the equal partner they are.",
      "But Lisa is far better placed than me to talk about working with local authorities, so I'd love to hear her view. (If Lisa has already spoken, drop this line.)"
    ],
    highlight: "And for my part: in Weymouth and on Portland, we're building the gold standard in neighbourhood health. If you'd like to see it, come and find me."
  }
];

const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const hint = document.getElementById('hint');
const totalQuestions = data.filter(d => typeof d.q === 'number').length;

data.forEach(d => {
  const card = document.createElement('div');
  card.className = 'card';

  const qnum = document.createElement('div');
  qnum.className = 'qnum';
  if (typeof d.q === 'number') {
    qnum.textContent = 'Q' + d.q;
  } else {
    qnum.textContent = d.q;
    qnum.classList.add('wide');
  }
  card.appendChild(qnum);

  if (d.question) {
    const question = document.createElement('p');
    question.className = 'question';
    question.textContent = d.question;
    card.appendChild(question);
  }

  const title = document.createElement('p');
  title.className = 'title';
  title.textContent = d.title;
  card.appendChild(title);

  if (d.link) {
    const linkBox = document.createElement('div');
    linkBox.className = 'link-line';
    const label = document.createElement('span');
    label.className = 'link-label';
    label.textContent = 'Opening line';
    linkBox.appendChild(label);
    linkBox.appendChild(document.createTextNode(d.link));
    card.appendChild(linkBox);
  }

  const ul = document.createElement('ul');
  ul.className = 'bullets';
  d.bullets.forEach(b => {
    const li = document.createElement('li');
    li.textContent = b;
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (d.highlight) {
    const highlight = document.createElement('p');
    highlight.className = 'highlight';
    highlight.textContent = d.highlight;
    card.appendChild(highlight);
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.textContent = d.footerText ? d.footerText : ('Question ' + d.q + ' of ' + totalQuestions);
  card.appendChild(footer);

  deck.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  progress.appendChild(dot);
});

progress.children[0].classList.add('active');

let hasScrolled = false;
deck.addEventListener('scroll', () => {
  if (!hasScrolled) {
    hasScrolled = true;
    hint.style.display = 'none';
  }
  const cardWidth = deck.children[0].getBoundingClientRect().width + 14;
  const idx = Math.min(data.length - 1, Math.max(0, Math.round(deck.scrollLeft / cardWidth)));
  Array.from(progress.children).forEach((dot, i) => {
    dot.classList.toggle('active', i === idx);
  });
}, { passive: true });
</script>

</body>
</html>
